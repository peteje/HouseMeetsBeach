<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Vento Vinte @ Chillaz Südstrand Fehmarn</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg1:#1a1440; --bg2:#5c2a6e; --bg3:#e8622c; --gold:#f2c14e;
    --card:#ffffff; --card-alt:#faf7f2; --text:#2b2333; --muted:#7a7188;
    --border:#e7e0f0; --danger:#d9534f; --ok:#3aa76d;
    --shadow: 0 10px 30px rgba(27,10,46,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background: radial-gradient(circle at 20% 0%, rgba(242,193,78,0.25), transparent 45%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    color:var(--text); padding:24px 16px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  header{text-align:center;color:#fff;margin-bottom:28px;}
  header h1{font-size:clamp(24px,5vw,36px);margin:0 0 6px;text-shadow:0 2px 12px rgba(0,0,0,0.35);}
  header h1 span{color:var(--gold);}
  header p{margin:4px 0;color:#f1e6ff;font-size:14px;}

  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:22px;}
  .card h2{margin:0 0 16px;font-size:18px;}

  #loginCard{max-width:360px;margin:60px auto 0;}
  #loginCard .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  #loginCard label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;}
  #loginCard input{padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:var(--card-alt);}
  .btn-primary{
    cursor:pointer;border:none;border-radius:10px;font-weight:700;font-size:14px;
    padding:11px 20px;background:linear-gradient(135deg,var(--bg3),#c9451c);color:#fff;
    box-shadow:0 4px 14px rgba(232,98,44,0.4);width:100%;
  }
  .btn-primary:hover{filter:brightness(1.05);}
  .error-text{color:var(--danger);font-size:13px;margin-top:8px;display:none;}

  #appArea{display:none;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--card-alt);border-radius:14px;padding:16px;text-align:center;border:1px solid var(--border);}
  .stat .num{font-size:28px;font-weight:800;color:var(--bg3);}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;margin-top:2px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);font-size:14px;}
  tr:last-child td{border-bottom:none;}
  td.center, th.center{text-align:center;}
  .muted-small{font-size:12px;color:var(--muted);}
  select.status-select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:13px;background:var(--card-alt);}
  .btn-danger{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:6px 10px;}
  .btn-danger:hover{text-decoration:underline;}
  .notes-input{width:100%;border:1px solid transparent;background:transparent;font-size:13px;color:var(--muted);padding:4px 6px;border-radius:6px;}
  .notes-input:focus{outline:none;border-color:var(--border);background:var(--card-alt);}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .btn-secondary{background:var(--card-alt);color:var(--text);border:1px solid var(--border);padding:8px 14px;font-size:13px;border-radius:10px;cursor:pointer;}
  .btn-secondary:hover{background:#f0e9fb;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🌅 Admin <span>Gästeliste</span></h1>
    <p>Vento Vinte @ Chillaz Südstrand Fehmarn</p>
  </header>

  <div class="card" id="loginCard">
    <h2>🔒 Anmelden</h2>
    <form id="loginForm">
      <div class="field">
        <label for="password">Passwort</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Anmelden</button>
      <div class="error-text" id="loginError"></div>
    </form>
  </div>

  <div id="appArea">
    <section class="card">
      <h2>📊 Übersicht</h2>
      <div class="stats">
        <div class="stat"><div class="num" id="statGuests">0</div><div class="label">Anmeldungen</div></div>
        <div class="stat"><div class="num" id="statAdults">0</div><div class="label">Erwachsene</div></div>
        <div class="stat"><div class="num" id="statChildren">0</div><div class="label">Kinder</div></div>
        <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Personen gesamt</div></div>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2 style="margin:0;">👥 Gästeliste</h2>
        <div style="display:flex;gap:8px;">
          <button class="btn-secondary" id="refreshBtn">Aktualisieren</button>
          <button class="btn-secondary" id="exportBtn">CSV exportieren</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Kontakt</th>
              <th class="center">Erw.</th>
              <th class="center">Kinder</th>
              <th class="center">Status</th>
              <th>Essenswunsch</th>
              <th>Notiz</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="guestTableBody"></tbody>
        </table>
        <div class="empty" id="emptyState" style="display:none;">Noch keine Anmeldungen.</div>
      </div>
    </section>
  </div>

</div>

<script src="admin.js"></script>
</body>
</html>
